name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/CoreChecks -c Release
      - run: dotnet run --project tests/WritingChecks -c Release
      - run: dotnet run --project tests/PolicyChecks -c Release
      - run: dotnet run --project tests/MinionChecks -c Release
      - run: python3 -m py_compile tools/build_job_bars.py tools/package_release.py
